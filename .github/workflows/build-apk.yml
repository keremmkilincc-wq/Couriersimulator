name: build-apk
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: mkdir -p www && cp index.html game.html game.js style.css www/ && cp -r assets www/
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk CourierSimulator.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: CourierSimulator.apk
